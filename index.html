<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шансон для души — Альбом</title>
<style>
  :root{
    --bg:#140a0c; /* Глубокий винный (почти черный) */
    --bg2:#2a1216; /* Темно-бордовый */
    --card:#36181d; /* Карточки цвета коньяка */
    --accent:#d4a373; /* Золотистый */
    --accent2:#b5835a;
    --text:#f5e6d3; /* Светло-кремовый */
    --muted:#a68a7b;
    --glow:rgba(212,163,115,.25);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2) 0%, var(--bg) 70%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; }
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:12px; object-fit:cover; box-shadow:0 20px 60px rgba(0,0,0,0.7); border:2px solid rgba(212,163,115,.3); pointer-events: none; }
  .album__title { font-size:clamp(28px,6vw,46px); font-weight:800; letter-spacing:-.02em; color: #fff; text-shadow: 0 4px 15px rgba(0,0,0,0.5); line-height: 1.1; }
  .album__sub { color:var(--accent); font-size:15px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
  
  .track { flex:0 0 auto; width:190px; scroll-snap-align:center; background:var(--card); border-radius:12px; padding:12px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(212,163,115,.1); text-align:center; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.3);}
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 25px var(--glow); border-color: rgba(212,163,115,.4); }
  .track.active { border:2px solid var(--accent); box-shadow:0 10px 25px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:8px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0;}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:4px; text-transform: uppercase; }
  .track__name { font-size:14px; font-weight:700; margin-bottom:6px; line-height: 1.2; color: #fff;}
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.3; flex-grow: 1; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.6); border:1px solid rgba(212,163,115,.15); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:8px; object-fit:cover; background:var(--bg2); border:1px solid rgba(212,163,115,.3); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:700; font-size:16px; line-height:1.25; margin-bottom:2px; color: #fff;}
  .player__artist { color:var(--muted); font-size:13px; }
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#140a0c; padding:12px 24px; border-radius:8px; font-weight:800; font-size:14px; cursor:pointer; transition:filter 0.3s; box-shadow: 0 4px 15px var(--glow);}
  .player__nav button:hover { filter:brightness(1.1); }
</style>
</head>
<body>

  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Обложка альбома">
    <h1 class="album__title">Шансон для души</h1>
    <p class="album__sub">Новый альбом</p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Выбери песню</div>
        <div class="player__artist" id="playerArtist">Шансон для души</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Пред</button>
      <button id="nextBtn">След ⏭</button>
    </div>
  </div>

<script>
  const album = {
    title: "Шансон для души",
    cover: "cover.jpg",
    tracks: [
      { id: 1, name: "Вне зоны доступа", desc: "О том, как важно иногда отключить телефон и побыть в тишине." },
      { id: 2, name: "Истинный смысл", desc: "О том, что карьера и деньги — пыль, если нет любви." },
      { id: 3, name: "Ответь на доброту", desc: "О том, как важно ценить близких, пока они рядом." },
      { id: 4, name: "Закалённые болью", desc: "О том, что настоящие чувства проходят через испытания." },
      { id: 5, name: "Три возраста пути", desc: "Об эволюции отношений." },
      { id: 6, name: "Фильтр времени", desc: "О том, как время отсеивает фальшивых людей." },
      { id: 7, name: "Быть, а не слыть", desc: "О настоящих ценностях и отказе от масок." },
      { id: 8, name: "Наука объятий", desc: "О важности тактильности и 30 секундах тепла." },
      { id: 9, name: "Зачем терять?", desc: "О том, что лучше договориться, чем ломать мосты." },
      { id: 10, name: "Садовник будущего", desc: "Философская притча о том, что мы пожинаем то, что посеяли." }
    ]
  };

  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `${pad(id)}.mp3`;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${t.name}">
        <div class="track__num">ТРЕК №${t.id}</div>
        <div class="track__name">${t.name}</div>
        <div class="track__desc">${t.desc}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = t.name;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  renderCarousel();
</script>
</body>
</html>
